name: Sync TopDatabase to Partner Sheet

on:
  schedule:
    # ~19:00 น. เวลาไทย = 12:00 UTC (รันหลัง 4 รอบ capture หลักของวันน่าจะ
    # เสร็จหมดแล้ว รวม buffer เผื่อ GitHub Actions delay ของรอบ 16:33 ด้วย)
    - cron: '3 12 * * 1-5'
  workflow_dispatch: {}   # ปุ่มกดรันทดสอบเองได้ในแท็บ Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install gspread google-auth

      - name: Decode Google service-account credentials
        run: echo "${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}" | base64 -d > gcp-credentials.json

      - name: Run sync script
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          TARGET_GSHEET_ID: ${{ secrets.TARGET_GSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-credentials.json
        run: python sync_topdatabase.py

      - name: Remove credentials file
        if: always()
        run: rm -f gcp-credentials.json
